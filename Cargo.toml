[package]
name = "rcodex"
version = "0.1.0"
edition = "2024"
description = "Persistent remote Codex workspaces over SSH"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
tui-input = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
nix = { version = "0.30", features = ["signal", "process"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

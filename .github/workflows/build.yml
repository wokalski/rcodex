name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: macos-15
            system: aarch64-darwin
          - os: macos-15-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - run: nix build -L .#packages.${{ matrix.system }}.default
      - run: ./result/bin/rcodex --help
      - name: Publish tested binary closure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo 'Set the CACHIX_AUTH_TOKEN repository secret to publish builds.' >&2
            exit 1
          fi
          cachix push "$CACHIX_CACHE" "$(readlink result)"
